[package]
name = "game_server_list"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.0", features = ["serde", "v4", "v7"] }
tokio = { version = "1.51.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.6.8", features = ["add-extension", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.149"
public-ip = "0.2.2"
axum-client-ip = { version = "1.3.1", features = ["connect-info", "serde"] }
envy = "0.4.2"
prometheus = "0.14.0"
lazy_static = "1.5.0"

[dev-dependencies]
tokio-tungstenite = "0.28.0"
futures-util = "0.3"
